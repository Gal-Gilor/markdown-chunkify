name: Execute Tests

# Lint, test and build the package on pushes and pull requests to the main branch.
# Only GitHub-owned actions are used; uv is installed with pip.

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.11,<0.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --no-fix .

      - name: Ruff format
        run: uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv>=0.11,<0.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Run Pytests
        run: uv run pytest -vv --cov=markdown_chunkify --cov-report=term-missing

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.11,<0.12"

      - name: Build the sdist and wheel
        run: uv build

      - name: Import the wheel without extras
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "from markdown_chunkify import MarkdownSplitter"

      # Importing the processor reads the bundled prompt template, so this fails if the
      # template is missing from the wheel.
      - name: Import the normalizer with the normalize extra
        run: |
          uv venv /tmp/normalize-check
          uv pip install --python /tmp/normalize-check/bin/python "$(ls dist/*.whl)[normalize]"
          /tmp/normalize-check/bin/python -c "from markdown_chunkify import UnicodeReplaceProcessor"
