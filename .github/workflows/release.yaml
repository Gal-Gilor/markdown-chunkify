name: Release

# Build the package and publish it to PyPI when a GitHub release is published.
# PyPI trusted publishing authenticates the upload, so no API token is stored.
# Only GitHub-owned actions are used; uv is installed with pip.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.13,<0.14"

      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"

      - name: Build the sdist and wheel
        run: uv build

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/markdown-chunkify/
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.13,<0.14"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
