name: Lint, test and build

# Lint, test and build the package on pushes and pull requests to the main branch.
# Only GitHub-owned actions are used; uv is installed with pip.

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.13,<0.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --no-fix .

      - name: Ruff format
        run: uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv>=0.13,<0.14"

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run Pytests
        run: uv run pytest -vv --cov=markdown_chunkify --cov-report=term-missing

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.13,<0.14"

      - name: Build the sdist and wheel
        run: uv build

      - name: Import the wheel
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "from markdown_chunkify import split_text; assert split_text('# Café')[0].section_header == 'Café'"

