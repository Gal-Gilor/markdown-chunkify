[project]
name = "markdown-chunkify"
version = "0.3.0"
description = "Split Markdown into hierarchical sections with ids, parent links and source spans."
authors = [
    {name = "Gal Gilor"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["markdown", "chunking", "text-splitter", "rag", "embeddings", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.1",
]

[project.urls]
Homepage = "https://github.com/Gal-Gilor/markdown-chunkify"
Changelog = "https://github.com/Gal-Gilor/markdown-chunkify/blob/main/CHANGELOG.md"
Issues = "https://github.com/Gal-Gilor/markdown-chunkify/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 94
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
