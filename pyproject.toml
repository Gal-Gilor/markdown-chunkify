[project]
name = "markdown-chunkify"
version = "0.3.0"
description = "Split Markdown documents into hierarchical sections."
authors = [
    {name = "Gal Gilor"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
pdf = [
    "pymupdf4llm>=1.28.2",
]

[project.urls]
Github = "https://github.com/Gal-Gilor/markdown-chunkify"
Issues = "https://github.com/Gal-Gilor/markdown-chunkify/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 94
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
